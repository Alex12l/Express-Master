<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!--BOOSTRAP 6 - ALPHA-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container">
        <h2 class="navbar-brand" href="#" id="who"></h2>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  type="button"
                  data-bs-toggle="menu"
                  aria-expanded="false"
                >
                  Menu
                </button>
                <div class="menu">
                  <a class="menu-item" href="#">Action</a>
                  <a class="menu-item" href="#">Another action</a>
                  <hr class="menu-divider" />
                  <a class="menu-item" href="#">Something else here</a>
                </div>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
            <form class="hstack gap-2" role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-secondary" type="button" id="logout">
                Cerrar Sesion
              </button>
            </form>
          </div>
        </dialog>
      </div>
    </nav>

    <section id="seccionPersonas">
      <div class="container my-4">
        <div>
          <h2>Personas</h2>
          <button
            class="btn-solid theme-primary"
            type="button"
            id="nuevaPersona"
          >
            Nueva Persona
          </button>
        </div>

        <table class="table table-hover">
          <thead class="theme-info">
            <tr>
              <th>Apellidos</th>
              <th>Nombres</th>
              <th>Telefono</th>
              <th>Email</th>
              <th>Dreccion</th>
              <th>Metodos</th>
            </tr>
          </thead>
          <tbody id="cuerpoPersonas"></tbody>
        </table>
      </div>
    </section>

    <!--Zona de Modales-->

    <dialog class="dialog" id="dialogPersona">
      <div class="dialog-header">
        <h1 class="dialog-title">Personas</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="dialog"
          aria-label="Close"
        ></button>
      </div>
      <div class="dialog-body">
        <form action="" id="formPersona">
          <div class="form-field">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              class="form-control"
              required
            />
          </div>

          <div class="form-field mt-3">
            <label for="nombres" class="form-label">Nombres</label>
            <input
              type="text"
              id="nombres"
              name="nombres"
              class="form-control"
              required
            />
          </div>

          <div class="form-field mt-3">
            <label for="telefono" class="form-label">Telefono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              class="form-control"
              maxlength="9"
              pattern="\d+"
            />
          </div>

          <div class="form-field mt-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              required
            />
          </div>

          <div class="form-field mt-3">
            <label for="direccion" class="form-label">Direccion</label>
            <input
              type="text"
              id="direccion"
              name="direccion"
              class="form-control"
              required
            />
          </div>

          <p class="text-danger" id="errorPersona"></p>
        </form>
      </div>
      <div class="dialog-footer">
        <button
          type="button"
          class="btn-solid theme-secondary"
          data-bs-dismiss="dialog"
        >
          Cerrar
        </button>
        <button
          type="submit"
          class="btn-solid theme-primary"
          form="formPersona"
        >
          Guardar
        </button>
      </div>
    </dialog>
    <!--Fin Zona de Modales-->

    <script src="./js/app.js"></script>
  </body>
</html>
